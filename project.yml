name: SolarSweep
options:
  bundleIdPrefix: com.friday.solarsweep
  deploymentTarget:
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  SolarSweepWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.friday.solarsweep.watchapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Solar Sweep
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchOnly: YES
    dependencies:
      - target: SolarSweepWidget
        embed: true
    scheme:
      testTargets:
        - SolarSweepTests
  SolarSweepWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Solar Sweep
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.friday.solarsweep.watchapp.widget
        SKIP_INSTALL: YES
  SolarSweepTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: Tests
      - path: Shared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SolarSweepWatch
